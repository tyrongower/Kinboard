services:
  kinboard:
    image: ${KINBOARD_IMAGE:-tyrongower/kinboard}:${KINBOARD_TAG:-latest}
    container_name: ${KINBOARD_CONTAINER_NAME:-kinboard}
    ports:
      - "${KINBOARD_PORT:-6565}:6565"
    volumes:
      - kinboard-data:/app/data
      # Uploaded avatars/job images live under the app's CWD, not /app/data.
      # Mounting here also makes /app/wwwroot exist at boot so UseStaticFiles
      # binds a real file provider instead of a NullFileProvider.
      - kinboard-media:/app/wwwroot
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=${TZ:-Australia/Sydney}
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET required}
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/kinboard.db
      # Must be the exact scheme://host:port users hit. Empty value throws at startup.
      - Cors__AllowedOrigins__0=${KINBOARD_ORIGIN:?KINBOARD_ORIGIN required, e.g. http://192.168.1.50:6565}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6565/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kinboard-data:
  kinboard-media:
